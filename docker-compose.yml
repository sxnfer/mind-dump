# One command runs the whole backend (D18):   docker compose up
# Order: db (healthy) → migrate (runs, exits 0) → api and worker.
# Settings come from .env next to this file (copy .env.example; never commit .env).
name: mind-dump

x-database-url: &database-url
  DATABASE_URL: postgresql://mind_dump:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}@db:5432/mind_dump

# D8: the owner's model keys and model names. All optional (`:-` allows empty): with no
# key for EMBEDDING_PROVIDER (openai by default: OPENAI_API_KEY; or voyage:
# VOYAGE_API_KEY) chunks are saved without vectors; with no ANTHROPIC_API_KEY images
# can't be described (nor questions answered). Empty values mean the defaults (openai,
# text-embedding-3-small, claude-opus-5-5; M5's answer and cost settings in
# .env.example, D9 and D39).
x-models: &models
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
  LLM_MODEL: ${LLM_MODEL:-}
  LLM_EFFORT: ${LLM_EFFORT:-}
  AGENT_MAX_TURNS: ${AGENT_MAX_TURNS:-}
  DAILY_COST_CAP_USD: ${DAILY_COST_CAP_USD:-}
  ASK_RATE_PER_MINUTE: ${ASK_RATE_PER_MINUTE:-}
  EMBEDDING_PRICE_PER_MTOK: ${EMBEDDING_PRICE_PER_MTOK:-}
  MODEL_PRICES: ${MODEL_PRICES:-}

services:
  db:
    image: pgvector/pgvector:pg18  # D3: Postgres 18 with the pgvector extension available
    environment:
      POSTGRES_USER: mind_dump
      POSTGRES_DB: mind_dump
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/18/...; mount the parent.
      - pgdata:/var/lib/postgresql
    ports:
      # Only on your Mac's loopback, so tests and psql can reach it; not your network.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mind_dump -d mind_dump"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  migrate:
    build: ./backend
    image: mind-dump-api:local
    command: ["python", "-m", "mind_dump.migrate"]
    environment:
      <<: *database-url
    healthcheck:
      disable: true  # a one-shot job, not a server
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: ./backend
    image: mind-dump-api:local
    environment:
      <<: [*database-url, *models]
    volumes:
      - rawdata:/data  # D5: landed pages live outside the container
    ports:
      # Loopback only, like the db. API_PORT in .env moves it if 8000 is taken.
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # D6: claims jobs from the jobs table, fetches links, reads files (D7b), chunks text and
  # embeds it (D8). Same image as the api.
  # Several copies are safe (FOR UPDATE SKIP LOCKED):  docker compose up --scale worker=2
  worker:
    build: ./backend
    image: mind-dump-api:local
    command: ["python", "-m", "mind_dump.worker"]
    environment:
      <<: [*database-url, *models]
    volumes:
      - rawdata:/data  # the same landed pages as the api (D5, D28)
    healthcheck:
      disable: true  # no HTTP server: the image's /health check would always fail here
    depends_on:
      migrate:
        condition: service_completed_successfully
    # SIGTERM lets the current job finish; Compose waits this long before SIGKILL.
    # Killed anyway, the job's lease runs out and it runs again (D30).
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  pgdata:  # survives `docker compose down`; only `down -v` deletes it
  rawdata:  # landed pages (D5, D28); same rule as pgdata
