# Nightly scans (D40): the same three scans as the CI gate, without its "a fix exists"
# filter, over the whole history and today's vulnerability databases.
#
# Why not in the gate: these read databases that change every day, so they can fail with
# no code change, on findings nobody can fix yet. A pull request should fail only for
# something its author can act on; this run tells the owner about the rest.
#
# Who hears about it: GitHub emails a failed scheduled run to the person who last
# changed the `cron` line below (San). Start it by hand from the Actions tab
# ("Run workflow"). GitHub pauses schedules in a public repo after 60 days with no
# activity; the Actions tab then shows a button to turn it back on.
name: Nightly scans

on:
  schedule:
    - cron: "23 3 * * *"   # 03:23 UTC every night (off the hour, when GitHub is busiest)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scans:
    name: nightly scans (secrets, dependencies, image)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # every commit, for the full-history secret scan

      # Same pinned file as ci.yml (D40).
      - name: Install gitleaks 8.30.1 (SHA-256 pinned)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      # `!cancelled()`: each scan runs even when an earlier one failed, so one email
      # reports all three. The job still fails if any of them did.
      - name: Secret scan, full history (gitleaks)
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          echo "Secret scan: full history, $(git rev-list --count --no-merges HEAD) non-merge commit(s), all branches fetched"
          "$RUNNER_TEMP/gitleaks" git . --redact --no-banner --verbose

      - uses: astral-sh/setup-uv@v6
        if: ${{ !cancelled() }}
        with:
          version: "0.13.7"
          enable-cache: false
      # Any finding fails: with or without a fix, and archived or quarantined packages.
      - name: Dependency audit, every finding (uv audit)
        if: ${{ !cancelled() }}
        working-directory: backend
        run: |
          set -euo pipefail
          echo "Dependency audit: backend/uv.lock against OSV, every finding fails"
          uv audit --locked --preview-features audit-command

      - uses: docker/setup-buildx-action@v3
        if: ${{ !cancelled() }}
      - name: Build image for the scan
        if: ${{ !cancelled() }}
        uses: docker/build-push-action@v6
        with:
          context: backend
          load: true
          push: false
          tags: mind-dump-api:scan
          pull: true          # today's base image, as a fresh build would get
          no-cache: true
      # High or critical fails, whether or not a fix exists. Accepted risks: .grype.yaml.
      - name: Image scan, high and critical with or without a fix (Grype)
        if: ${{ !cancelled() }}
        env:
          GRYPE_IMAGE: anchore/grype:v0.122.1@sha256:661583704a253c0448ed63998b5ea2cd9d5a76ee71eedc4aed439b8ce3e93a1c
        run: |
          set -euo pipefail
          docker save mind-dump-api:scan -o "$RUNNER_TEMP/image.tar"
          echo "Image scan: mind-dump-api:scan, image id $(docker image inspect --format '{{.Id}}' mind-dump-api:scan)"
          status=0
          docker run --rm -v "$RUNNER_TEMP:/scan" -v "$PWD/.grype.yaml:/config/grype.yaml:ro" \
            "$GRYPE_IMAGE" docker-archive:/scan/image.tar -c /config/grype.yaml \
            --fail-on high -o table -o json=/scan/grype.json || status=$?
          jq -r '"Grype: \(.distro.name) \(.distro.version); findings: \(.matches | length) ("
            + ([.matches[].vulnerability.severity] | group_by(.) | map("\(.[0]) \(length)") | join(", "))
            + "); with a fix: \([.matches[] | select(.vulnerability.fix.state == "fixed")] | length)"' \
            "$RUNNER_TEMP/grype.json" || echo "::error::Grype wrote no report"
          echo "grype exit status: $status (0 pass, 2 a high or critical finding)"
          exit "$status"
