# CI (D14): every push to main and every pull request runs two jobs on fresh
# machines. The ruleset "main: require CI" blocks merging until both pass.
# If you rename a job, update the ruleset too.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the jobs only read the repo.
permissions:
  contents: read

# A new push to the same branch cancels the older, now-pointless run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (lint, test, image, smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    # A real Postgres next to the job, for the tests (explainer M1, section 07).
    # Same image as docker-compose.yml. Throwaway password: this database lives for one run.
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: mind_dump
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: mind_dump
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mind_dump -d mind_dump"
          --health-interval 2s --health-timeout 3s --health-retries 15

    steps:
      - uses: actions/checkout@v5

      # Same uv version as on your Mac (D24). Its cache is keyed on uv.lock.
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # --frozen: fail if uv.lock is out of date instead of quietly changing it.
      - name: Install exact locked dependencies
        run: uv sync --frozen

      # Cheap checks first, so a typo fails in seconds.
      - name: Lint (ruff check)
        run: uv run ruff check --output-format=github .
      - name: Format (ruff format --check)
        run: uv run ruff format --check .

      - name: Tests (pytest, real Postgres)
        env:
          TEST_DATABASE_URL: postgresql://mind_dump:ci-only-password@localhost:5432/mind_dump_test
        run: uv run pytest

      # Buildx + the GitHub Actions cache keep Docker layers between runs.
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: backend
          load: true            # keep the image on this runner for the smoke test
          push: false           # publishing images comes in M7
          tags: mind-dump-api:local   # the tag docker-compose.yml uses
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The smoke test runs the exact command a stranger types: docker compose up.
      # It also proves the M1 done-when: a saved link survives a restart of both containers,
      # the P3 one: the worker container picks up a saved note and chunks it, and M3's:
      # the image can read a PDF, with no model keys at all.
      - name: Smoke test (compose up, save, restart, read back)
        working-directory: .
        run: |
          printf 'POSTGRES_PASSWORD=ci-smoke-password\nDB_PORT=5433\n' > .env
          docker compose up -d --no-build --wait api worker
          curl --fail -sS -X POST localhost:8000/items \
            -H 'content-type: application/json' \
            -d '{"type":"link","url":"https://example.com/smoke"}'
          docker compose down
          docker compose up -d --no-build --wait api worker
          curl --fail -sS localhost:8000/items | tee /tmp/items.json
          grep -q 'https://example.com/smoke' /tmp/items.json

          # P3: save a note, wait for the worker to make it ready, then read its chunks.
          id=$(curl --fail -sS -X POST localhost:8000/items \
            -H 'content-type: application/json' \
            -d '{"type":"note","body":"Smoke test note.\n\nIt should become one chunk."}' \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["id"])')
          status=""
          for _ in $(seq 1 30); do
            status=$(curl --fail -sS "localhost:8000/items/$id" \
              | python3 -c 'import json, sys; print(json.load(sys.stdin)["status"])')
            echo "note $id: $status"
            [ "$status" = ready ] && break
            sleep 1
          done
          test "$status" = ready
          curl --fail -sS "localhost:8000/items/$id/chunks" | tee /tmp/chunks.json
          python3 -c 'import json; c = json.load(open("/tmp/chunks.json")); assert len(c) >= 1, c'

          # M3 (D7b): upload a two-page PDF. CI has no model keys, so it ends ready with
          # chunks that carry page numbers and no vectors (D8: keys are optional).
          (cd backend && uv run python tests/pdfs.py /tmp/smoke.pdf)
          id=$(curl --fail -sS --data-binary @/tmp/smoke.pdf \
            -H 'Content-Disposition: attachment; filename="smoke.pdf"' localhost:8000/items/upload \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["id"])')
          status=""
          for _ in $(seq 1 30); do
            status=$(curl --fail -sS "localhost:8000/items/$id" \
              | python3 -c 'import json, sys; print(json.load(sys.stdin)["status"])')
            echo "pdf $id: $status"
            [ "$status" = ready ] && break
            sleep 1
          done
          test "$status" = ready
          curl --fail -sS "localhost:8000/items/$id/chunks" | tee /tmp/pdf_chunks.json
          python3 -c 'import json; c = json.load(open("/tmp/pdf_chunks.json")); assert [x["page"] for x in c] == [1, 2], c; assert not any(x["embedded"] for x in c), c'
      - name: Compose logs (on failure)
        if: failure()
        working-directory: .
        run: docker compose logs --no-color || true

  app:
    name: app (xcodebuild)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Show Xcode version
        run: xcodebuild -version
      # Unsigned build (D22): CI proves it compiles; nobody installs this copy.
      - name: Build the Mac app
        run: |
          xcodebuild \
            -project app/MindDump.xcodeproj \
            -scheme MindDump \
            -configuration Release \
            -derivedDataPath app/build/dd \
            CODE_SIGNING_ALLOWED=NO \
            build
