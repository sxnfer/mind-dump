# CI (D14): every push to main and every pull request runs two jobs on fresh
# machines. The ruleset "main: require CI" blocks merging until both pass.
# If you rename a job, update the ruleset too.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the jobs only read the repo.
permissions:
  contents: read

# A new push to the same branch cancels the older, now-pointless run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (lint, test, image, smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    # A real Postgres next to the job, for the tests (explainer M1, section 07).
    # Same image as docker-compose.yml. Throwaway password: this database lives for one run.
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: mind_dump
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: mind_dump
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mind_dump -d mind_dump"
          --health-interval 2s --health-timeout 3s --health-retries 15

    steps:
      - uses: actions/checkout@v5

      # Same uv version as on your Mac (D24). Its cache is keyed on uv.lock.
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # P4 (D40): uv.lock must match pyproject.toml. Without this, a PR that edits
      # pyproject.toml but not the lockfile passes here (uv sync --frozen trusts the
      # lockfile) and breaks the next `uv sync` on someone's Mac. Fix: run `uv lock`.
      - name: Lockfile is current (uv lock --check)
        run: uv lock --check

      # --frozen: fail if uv.lock is out of date instead of quietly changing it.
      - name: Install exact locked dependencies
        run: uv sync --frozen

      # Cheap checks first, so a typo fails in seconds.
      - name: Lint (ruff check)
        run: uv run ruff check --output-format=github .
      - name: Format (ruff format --check)
        run: uv run ruff format --check .

      # P4 (D40): a new install runs every migration on an empty database; an upgrade
      # runs the command again. Its own database on the service, used by nothing else.
      # Fails unless run 1 applies every file and run 2 applies none.
      - name: Migrations from an empty database, run twice
        env:
          DATABASE_URL: postgresql://mind_dump:ci-only-password@localhost:5432/mind_dump_migrations
        run: scripts/migrations_twice.sh

      - name: Tests (pytest, real Postgres)
        env:
          TEST_DATABASE_URL: postgresql://mind_dump:ci-only-password@localhost:5432/mind_dump_test
        run: uv run pytest

      # M4: the search eval. It loads the committed corpus (backend/eval/) through the
      # real pipeline into its own database, asks the 20 golden questions, and prints
      # recall@5 and MRR. CI has no model keys, so only keyword search is measured.
      # The floor: keyword recall@5 was 0.80 (16 of 20, docs/results.md); 0.75 allows one
      # question to slip, and two fail the build. To change it, run the eval locally,
      # commit the new docs/results.md, and set the floor one question (0.05) below it.
      - name: Search eval (keyword recall@5 floor)
        env:
          EVAL_DATABASE_URL: postgresql://mind_dump:ci-only-password@localhost:5432/mind_dump_eval
        run: uv run python -m mind_dump.eval --modes keyword --no-results --min-keyword-recall 0.75

      # Buildx + the GitHub Actions cache keep Docker layers between runs.
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: backend
          load: true            # keep the image on this runner for the smoke test
          push: false           # publishing images comes in M7
          tags: mind-dump-api:local   # the tag docker-compose.yml uses
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The smoke test runs the exact command a stranger types: docker compose up.
      # It also proves the M1 done-when: a saved link survives a restart of both containers,
      # the P3 one: the worker container picks up a saved note and chunks it, and M3's:
      # the image can read a PDF, with no model keys at all.
      - name: Smoke test (compose up, save, restart, read back)
        working-directory: .
        run: |
          printf 'POSTGRES_PASSWORD=ci-smoke-password\nDB_PORT=5433\n' > .env
          docker compose up -d --no-build --wait api worker
          curl --fail -sS -X POST localhost:8000/items \
            -H 'content-type: application/json' \
            -d '{"type":"link","url":"https://example.com/smoke"}'
          docker compose down
          docker compose up -d --no-build --wait api worker
          curl --fail -sS localhost:8000/items | tee /tmp/items.json
          grep -q 'https://example.com/smoke' /tmp/items.json

          # P3: save a note, wait for the worker to make it ready, then read its chunks.
          id=$(curl --fail -sS -X POST localhost:8000/items \
            -H 'content-type: application/json' \
            -d '{"type":"note","body":"Smoke test note.\n\nIt should become one chunk."}' \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["id"])')
          status=""
          for _ in $(seq 1 30); do
            status=$(curl --fail -sS "localhost:8000/items/$id" \
              | python3 -c 'import json, sys; print(json.load(sys.stdin)["status"])')
            echo "note $id: $status"
            [ "$status" = ready ] && break
            sleep 1
          done
          test "$status" = ready
          curl --fail -sS "localhost:8000/items/$id/chunks" | tee /tmp/chunks.json
          python3 -c 'import json; c = json.load(open("/tmp/chunks.json")); assert len(c) >= 1, c'

          # M4: search finds the note by its words. No OPENAI_API_KEY, so hybrid falls
          # back to keyword results and says so (D37).
          curl --fail -sS "localhost:8000/search?q=smoke" | tee /tmp/search.json
          python3 -c 'import json; r = json.load(open("/tmp/search.json")); assert r["mode"] == "keyword" and r["degraded"] and r["hits"], r'

          # M3 (D7b): upload a two-page PDF. CI has no model keys, so it ends ready with
          # chunks that carry page numbers and no vectors (D8: keys are optional).
          (cd backend && uv run python tests/pdfs.py /tmp/smoke.pdf)
          id=$(curl --fail -sS --data-binary @/tmp/smoke.pdf \
            -H 'Content-Disposition: attachment; filename="smoke.pdf"' localhost:8000/items/upload \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["id"])')
          status=""
          for _ in $(seq 1 30); do
            status=$(curl --fail -sS "localhost:8000/items/$id" \
              | python3 -c 'import json, sys; print(json.load(sys.stdin)["status"])')
            echo "pdf $id: $status"
            [ "$status" = ready ] && break
            sleep 1
          done
          test "$status" = ready
          curl --fail -sS "localhost:8000/items/$id/chunks" | tee /tmp/pdf_chunks.json
          python3 -c 'import json; c = json.load(open("/tmp/pdf_chunks.json")); assert [x["page"] for x in c] == [1, 2], c; assert not any(x["embedded"] for x in c), c'
      - name: Compose logs (on failure)
        if: failure()
        working-directory: .
        run: docker compose logs --no-color || true

  app:
    name: app (xcodebuild)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Show Xcode version
        run: xcodebuild -version
      # Unsigned build (D22): CI proves it compiles; nobody installs this copy.
      - name: Build the Mac app
        run: |
          xcodebuild \
            -project app/MindDump.xcodeproj \
            -scheme MindDump \
            -configuration Release \
            -derivedDataPath app/build/dd \
            CODE_SIGNING_ALLOWED=NO \
            build

  # P4 (D40): security scans, in their own job so each scan has its own log.
  # This job name is a required check in the ruleset: rename both together.
  scans:
    name: scans (secrets, dependencies, image)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history: the secret scan reads commits, not just files

      # Gitleaks (MIT) as a plain binary, not gitleaks-action (other licence since v2).
      # Pinned by the SHA-256 of the release file (D40: a movable tag or a replaced
      # release file cannot change what runs; see the Trivy incident, March 2026).
      # Checked 2026-11-25 against the release's checksums.txt and GitHub's asset digest.
      - name: Install gitleaks 8.30.1 (SHA-256 pinned)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      # Scans the commits this change adds: on a pull request base..head, on a push the
      # pushed range. A commit it can't find (first push, force push, all-zero `before`)
      # means a full-history scan instead: gitleaks scans 0 commits on an unknown range
      # and passes, so the range is checked here first. Values are redacted in the log.
      - name: Secret scan (gitleaks)
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          is_commit() { [ -n "$1" ] && git cat-file -e "$1^{commit}" 2>/dev/null; }
          if [ "$EVENT" = pull_request ]; then base=$PR_BASE; head=$PR_HEAD; else base=$PUSH_BEFORE; head=$PUSH_AFTER; fi
          if is_commit "$base" && is_commit "$head"; then
            range="$base..$head"
            echo "Secret scan ($EVENT): commits $range, $(git rev-list --count --no-merges "$range") non-merge commit(s)"
            "$RUNNER_TEMP/gitleaks" git . --redact --no-banner --verbose --log-opts="$range"
          else
            echo "Secret scan ($EVENT): range '${base:-none}..${head:-none}' not found, so full history, $(git rev-list --count --no-merges HEAD) non-merge commit(s)"
            "$RUNNER_TEMP/gitleaks" git . --redact --no-banner --verbose
          fi

      # D40: dependencies in uv.lock against OSV, with uv's built-in `uv audit`
      # (experimental in uv 0.13.7; --preview-features silences the warning). uv audit
      # fails on ANY finding, so scripts/audit_gate.py reads its JSON and blocks only
      # when a finding has a fixed version; the rest are printed, and the nightly scan
      # fails on them. Accepted risk: add `--ignore <ID>` to the uv audit line below,
      # with a comment line above it: date, who, reason.
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
          enable-cache: false   # the audit reads uv.lock only; it installs nothing
      - name: Dependency audit (uv audit, blocks when a fix exists)
        working-directory: backend
        run: |
          set -euo pipefail
          status=0
          uv audit --locked --preview-features audit-command,json-output --output-format json \
            > "$RUNNER_TEMP/audit.json" || status=$?
          echo "uv audit exit status: $status (0 clean, 1 findings, other: it could not run)"
          if [ "$status" -gt 1 ]; then echo "::error::uv audit could not run"; exit "$status"; fi
          python3 scripts/audit_gate.py "$RUNNER_TEMP/audit.json" --uv-exit "$status"

      # D40: the image this commit builds, scanned with Grype (Anchore, Apache-2.0).
      # Grype runs from its image pinned by digest, and reads a saved copy of our image
      # (docker save), so it needs no access to the Docker daemon.
      - uses: docker/setup-buildx-action@v3
      - name: Build image for the scan
        uses: docker/build-push-action@v6
        with:
          context: backend
          load: true
          push: false
          tags: mind-dump-api:scan
          cache-from: type=gha   # reuses the backend job's layers; this job writes none
      # --only-fixed drops findings with no fix (not-fixed, wont-fix, unknown); --fail-on
      # high then exits 2 on any high or critical finding left. Accepted risks: .grype.yaml.
      - name: Image scan (Grype, blocks on high or critical with a fix)
        env:
          GRYPE_IMAGE: anchore/grype:v0.122.1@sha256:661583704a253c0448ed63998b5ea2cd9d5a76ee71eedc4aed439b8ce3e93a1c
        run: |
          set -euo pipefail
          docker save mind-dump-api:scan -o "$RUNNER_TEMP/image.tar"
          echo "Image scan: mind-dump-api:scan, image id $(docker image inspect --format '{{.Id}}' mind-dump-api:scan)"
          status=0
          docker run --rm -v "$RUNNER_TEMP:/scan" -v "$PWD/.grype.yaml:/config/grype.yaml:ro" \
            "$GRYPE_IMAGE" docker-archive:/scan/image.tar -c /config/grype.yaml \
            --only-fixed --fail-on high -o table -o json=/scan/grype.json || status=$?
          jq -r '"Grype: \(.source.target.imageID), \(.distro.name) \(.distro.version); findings with a fix: \(.matches | length) ("
            + ([.matches[].vulnerability.severity] | group_by(.) | map("\(.[0]) \(length)") | join(", ")) + ")"' \
            "$RUNNER_TEMP/grype.json" || echo "::error::Grype wrote no report"
          echo "grype exit status: $status (0 pass, 2 a high or critical finding has a fix)"
          exit "$status"
